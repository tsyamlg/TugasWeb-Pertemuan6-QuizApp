    <div class="wrapper">
        <div class="main-card">
            
            <!-- START SCREEN -->
            <div id="screen-start" class="screen active">
                <div class="badge-tag">TUGAS RUTIN 6</div>
                <h1 class="title-gradient">Notes Quiz</h1>
                <p class="subtitle">Uji kemampuan web development kamu dengan kuis interaktif ala Notes!</p>
                
                <div class="high-score-card">
                    <span class="trophy">🏆</span>
                    <div>
                        <div class="hs-label">HIGH SCORE TERBAIK</div>
                        <div id="start-high-score" class="hs-value">0 Pts</div>
                    </div>
                </div>

                <button id="btn-start" class="btn primary-btn">
                    Mulai Kuis Sekarang ✨
                </button>
            </div>

            <!-- QUIZ SCREEN -->
            <div id="screen-quiz" class="screen">
                <div class="quiz-header">
                    <div class="meta-row">
                        <span id="question-tracker" class="tracker-badge">Soal 1 / 5</span>
                        <div class="timer-badge">
                            <span class="timer-icon">⏱️</span>
                            <span id="timer">15s</span>
                        </div>
                    </div>
                    <div class="progress-track">
                        <div id="progress-bar" class="progress-fill"></div>
                    </div>
                </div>

                <!-- Flashcard Wrapper -->
                <div class="flashcard-container">
                    <div id="flashcard" class="flashcard">
                        <div class="card-inner">
                            <h2 id="question-text" class="question-text">Memuat pertanyaan...</h2>
                        </div>
                    </div>
                </div>

                <!-- Interactive Options -->
                <div id="options-container" class="options-grid"></div>

                <div class="quiz-footer">
                    <button id="btn-next" class="btn next-btn hidden">
                        Lanjut Soal ➔
                    </button>
                </div>
            </div>

            <!-- RESULT SCREEN -->
            <div id="screen-result" class="screen">
                <div class="result-badge-icon">🎉</div>
                <h2 class="title-gradient">Kuis Selesai!</h2>
                
                <div class="score-display-box">
                    <span class="score-label">SKOR AKHIR KAMU</span>
                    <div id="final-score" class="score-number">0</div>
                    <p id="score-message" class="score-status">Kerja Hebat!</p>
                </div>

                <div class="high-score-card">
                    <span class="trophy">🏆</span>
                    <div>
                        <div class="hs-label">REKOR TERTINGGI</div>
                        <div id="result-high-score" class="hs-value">0 Pts</div>
                    </div>
                </div>

                <button id="btn-restart" class="btn primary-btn">
                    Ulangi Kuis 🔄
                </button>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
